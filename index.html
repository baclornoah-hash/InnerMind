<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emotiary</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f0eb;
    color: #302b27;
}

.container {
    width: 92%;
    max-width: 850px;
    margin: auto;
    padding: 25px 0 60px;
}

h1 {
    color: #70548f;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

textarea {
    width: 100%;
    min-height: 170px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    resize: vertical;
    font-family: inherit;
    font-size: 16px;
}

textarea:focus {
    outline: none;
    border-color: #8064a8;
}

/* CATEGORY BUTTONS */

.category-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 15px 0;
}

.category {
    padding: 14px 5px;
    border: 3px solid;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.category.active {
    background: #302b27;
    color: white;
}

/* SPECIFIC EMOTIONS */

.emotion-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.emotion {
    padding: 11px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
}

.emotion.active {
    background: #8064a8;
    color: white;
    border-color: #8064a8;
}

/* SAVE */

.save-button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #8064a8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: #634b86;
}

.message {
    margin-top: 12px;
    text-align: center;
    font-weight: bold;
}

/* PIE CHART */

.chart-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}

canvas {
    max-width: 420px;
    width: 100%;
    height: auto;
}

.chart-legend {
    width: 100%;
    max-width: 500px;
    margin-top: 15px;
}

.legend-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.legend-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
}

/* ENTRIES */

.entry {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 15px;
    margin-top: 12px;
    background: #fffdfb;
}

.entry-number {
    font-weight: bold;
    color: #70548f;
}

.entry-date {
    color: #777;
    font-size: 12px;
    margin: 5px 0 12px;
}

.entry-emotion {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.advice {
    margin-top: 15px;
    padding: 15px;
    background: #f3eef8;
    border-radius: 12px;
}

.advice strong {
    color: #70548f;
}

.delete-button {
    margin-top: 12px;
    border: none;
    background: transparent;
    color: #a55;
    cursor: pointer;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
}

.locked {
    text-align: center;
    padding: 30px 10px;
    color: #777;
}

.analysis-range {
    text-align: center;
    color: #777;
    font-size: 14px;
}

@media (max-width: 600px) {

    .category-list {
        grid-template-columns: repeat(2, 1fr);
    }

    .emotion-list {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>
</head>


<body>

<div class="container">

<h1>🌙 Emotiary</h1>

<p>
Write about your day, then choose the emotion that best describes
what you felt.
</p>


<!-- =========================
     NEW ENTRY
========================= -->

<div class="card">

<h2>📔 New Entry</h2>

<textarea
    id="diaryText"
    placeholder="What's on your mind?"
></textarea>


<h3>1. Choose your main emotion</h3>

<div
    class="category-list"
    id="categoryList">
</div>


<h3>2. Choose a specific emotion</h3>

<div
    class="emotion-list"
    id="emotionList">
</div>


<button
    type="button"
    class="save-button"
    id="saveButton">

Save Entry

</button>


<div
    class="message"
    id="message">
</div>

</div>


<!-- =========================
     100 ENTRY ANALYSIS
========================= -->

<div class="card">

<h2>📊 Emotional Profile</h2>

<p class="analysis-range" id="analysisRange"></p>

<div id="analysisContent"></div>

</div>


<!-- =========================
     DIARY
========================= -->

<div class="card">

<h2>📚 Your Diary</h2>

<div id="entries"></div>

</div>

</div>


<script>

/* =====================================
   EMOTION DATA
===================================== */

const categories = [

{
    id: "red",
    name: "Angry",
    color: "#d9534f",

    emotions: [
        "Angry",
        "Irritated",
        "Frustrated",
        "Furious",
        "Agitated",
        "Tense",
        "Alert",
        "Suspicious",
        "Wary",
        "Alarmed",
        "Intense",
        "Passionate",
        "Impatient",
        "Restless",
        "Defensive",
        "Provoked",
        "Startled",
        "Uneasy",
        "Overwhelmed",
        "Determined"
    ]
},

{
    id: "blue",
    name: "Sad",
    color: "#4d82b8",

    emotions: [
        "Sad",
        "Hopeless",
        "Melancholic",
        "Pessimistic",
        "Lonely",
        "Nostalgic",
        "Regretful",
        "Guilty",
        "Ashamed",
        "Vulnerable",
        "Discouraged",
        "Miserable",
        "Grieving",
        "Reflective",
        "Contemplative",
        "Resigned",
        "Yearning",
        "Insecure",
        "Empty",
        "Despairing"
    ]
},

{
    id: "black",
    name: "Serious",
    color: "#333333",

    emotions: [
        "Serious",
        "Calm",
        "Composed",
        "Neutral",
        "Detached",
        "Stoic",
        "Focused",
        "Curious",
        "Skeptical",
        "Doubtful",
        "Confused",
        "Perplexed",
        "Concerned",
        "Cautious",
        "Rational",
        "Objective",
        "Patient",
        "Controlled",
        "Analytical",
        "Uncertain"
    ]
},

{
    id: "white",
    name: "Confident",
    color: "#777777",

    emotions: [
        "Confident",
        "Proud",
        "Charismatic",
        "Excited",
        "Amused",
        "Flattered",
        "Admiring",
        "Competitive",
        "Ambitious",
        "Triumphant",
        "Superior",
        "Elegant",
        "Playful",
        "Charming",
        "Bold",
        "Hopeful",
        "Envious",
        "Jealous",
        "Embarrassed",
        "Humiliated"
    ]
},

{
    id: "green",
    name: "Happy",
    color: "#4f9b68",

    emotions: [
        "Happy",
        "Joyful",
        "Overjoyed",
        "Cheerful",
        "Excited",
        "Delighted",
        "Amused",
        "Affectionate",
        "Loving",
        "Grateful",
        "Hopeful",
        "Comforted",
        "Relieved",
        "Inspired",
        "Tender",
        "Compassionate",
        "Empathetic",
        "Sentimental",
        "Energetic",
        "Euphoric"
    ]
}

];


/* =====================================
   EMOTIONAL CYCLE / ADVICE
===================================== */

const advice = {

    "Angry": {

        positive: [
            "Passionate",
            "Determined",
            "Intense"
        ],

        destination: "Confident",

        line:
            "Your intensity can become confidence when you direct it toward something constructive.",

        quote:
            "Anger can show that something matters. Decide what you want to do with that energy."

    },


    "Confident": {

        positive: [
            "Reflective",
            "Contemplative",
            "Vulnerable"
        ],

        destination: "Sad",

        line:
            "Confidence is powerful, but reflection can keep confidence from becoming pride or ego.",

        quote:
            "Strength does not disappear when you pause and look inward."

    },


    "Sad": {

        positive: [
            "Hopeful",
            "Inspired",
            "Grateful",
            "Relieved"
        ],

        destination: "Happy",

        line:
            "When sadness becomes overwhelming, look for one small thing that can bring hope or relief.",

        quote:
            "You do not have to solve everything today. Find one reason to keep moving."

    },


    "Happy": {

        positive: [
            "Calm",
            "Composed",
            "Controlled"
        ],

        destination: "Serious",

        line:
            "Joy is valuable, but slowing down can help keep excitement from becoming reckless or exhausting.",

        quote:
            "You can enjoy the moment without letting the moment control you."

    },


    "Serious": {

        positive: [
            "Passionate",
            "Determined",
            "Intense"
        ],

        destination: "Angry",

        line:
            "When thinking becomes excessive or detachment keeps you stuck, action and passion may help.",

        quote:
            "Not every answer is found by thinking longer. Sometimes you have to move."

    }

};


/* =====================================
   STATE
===================================== */

let selectedCategory = null;

let selectedEmotion = null;

let entries = [];


try {

    entries =
        JSON.parse(
            localStorage.getItem(
                "emotiaryEntries"
            )
        ) || [];

} catch (error) {

    entries = [];

}


/* =====================================
   CREATE CATEGORIES
===================================== */

function createCategories() {

    const container =
        document.getElementById(
            "categoryList"
        );

    container.innerHTML = "";

    categories.forEach(
        function(category) {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "category";

            button.textContent =
                category.name;

            button.style.borderColor =
                category.color;


            button.addEventListener(
                "click",
                function() {

                    selectedCategory =
                        category;

                    selectedEmotion =
                        null;


                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    createEmotions(
                        category
                    );

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================
   CREATE SPECIFIC EMOTIONS
===================================== */

function createEmotions(category) {

    const container =
        document.getElementById(
            "emotionList"
        );

    container.innerHTML = "";


    category.emotions.forEach(
        function(emotion) {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "emotion";

            button.textContent =
                emotion;


            button.addEventListener(
                "click",
                function() {

                    selectedEmotion =
                        emotion;


                    document
                        .querySelectorAll(
                            ".emotion"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    button.classList.add(
                        "active"
                    );

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================
   SAVE ENTRY
===================================== */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        function() {

            const text =
                document
                    .getElementById(
                        "diaryText"
                    )
                    .value
                    .trim();


            if (text === "") {

                showMessage(
                    "Please write something first."
                );

                return;

            }


            if (selectedCategory === null) {

                showMessage(
                    "Please choose a main emotion."
                );

                return;

            }


            if (selectedEmotion === null) {

                showMessage(
                    "Please choose a specific emotion."
                );

                return;

            }


            const entry = {

                id: Date.now(),

                number:
                    entries.length + 1,

                date:
                    new Date().toLocaleString(),

                text:
                    text,

                category:
                    selectedCategory.name,

                color:
                    selectedCategory.color,

                emotion:
                    selectedEmotion

            };


            entries.push(entry);


            try {

                localStorage.setItem(
                    "emotiaryEntries",
                    JSON.stringify(
                        entries
                    )
                );

            } catch (error) {

                showMessage(
                    "Could not save this entry."
                );

                return;

            }


            document
                .getElementById(
                    "diaryText"
                )
                .value = "";


            selectedCategory = null;

            selectedEmotion = null;


            document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    function(button) {

                        button.classList
                            .remove(
                                "active"
                            );

                    }
                );


            document
                .getElementById(
                    "emotionList"
                )
                .innerHTML = "";


            showMessage(
                "Entry saved successfully! 💜"
            );


            displayEntries();

            updateAnalysis();

        }
    );


/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;


    setTimeout(
        function() {

            message.textContent =
                "";

        },
        3000
    );

}


/* =====================================
   100-ENTRY ANALYSIS
===================================== */

function getLatest100() {

    return entries.slice(
        Math.max(
            0,
            entries.length - 100
        )
    );

}


/* =====================================
   PIE CHART
===================================== */

function updateAnalysis() {

    const content =
        document.getElementById(
            "analysisContent"
        );

    const range =
        document.getElementById(
            "analysisRange"
        );


    if (entries.length < 100) {

        range.textContent =
            entries.length +
            " / 100 entries recorded";


        content.innerHTML =
            '<div class="locked">' +
            '<h3>🔒 Emotional Profile Locked</h3>' +
            '<p>' +
            'Complete 100 diary entries to unlock your emotional pie chart.' +
            '</p>' +
            '</div>';

        return;

    }


    const latest =
        getLatest100();


    const counts = {};


    categories.forEach(
        function(category) {

            counts[
                category.name
            ] = 0;

        }
    );


    latest.forEach(
        function(entry) {

            if (
                counts[
                    entry.category
                ] !== undefined
            ) {

                counts[
                    entry.category
                ]++;

            }

        }
    );


    const firstNumber =
        latest[0].number;

    const lastNumber =
        latest[
            latest.length - 1
        ].number;


    range.textContent =
        "Analyzing entries #" +
        firstNumber +
        "–#" +
        lastNumber;


    content.innerHTML = "";


    const chartArea =
        document.createElement(
            "div"
        );

    chartArea.className =
        "chart-area";


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 420;

    canvas.height = 420;


    chartArea.appendChild(
        canvas
    );


    const legend =
        document.createElement(
            "div"
        );

    legend.className =
        "chart-legend";


    chartArea.appendChild(
        legend
    );


    content.appendChild(
        chartArea
    );


    drawPieChart(
        canvas,
        counts
    );


    categories.forEach(
        function(category) {

            const percentage =
                Math.round(
                    (
                        counts[
                            category.name
                        ] / 100
                    ) * 100
                );


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "legend-item";


            item.innerHTML =

                '<div class="legend-left">' +

                '<span class="legend-dot" ' +
                'style="background:' +
                category.color +
                '"></span>' +

                '<span>' +
                category.name +
                '</span>' +

                '</div>' +

                '<strong>' +
                percentage +
                '%</strong>';


            legend.appendChild(
                item
            );

        }
    );

}


/* =====================================
   DRAW PIE CHART
===================================== */

function drawPieChart(
    canvas,
    counts
) {

    const ctx =
        canvas.getContext(
            "2d"
        );


    const total = 100;

    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;

    const radius =
        170;


    let startAngle =
        -Math.PI / 2;


    categories.forEach(
        function(category) {

            const value =
                counts[
                    category.name
                ];


            const slice =
                (
                    value / total
                ) *
                Math.PI *
                2;


            ctx.beginPath();

            ctx.moveTo(
                centerX,
                centerY
            );

            ctx.arc(
                centerX,
                centerY,
                radius,
                startAngle,
                startAngle + slice
            );

            ctx.closePath();


            ctx.fillStyle =
                category.color;

            ctx.fill();


            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth = 3;

            ctx.stroke();


            startAngle += slice;

        }
    );


    /* center hole */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        65,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    ctx.fillStyle =
        "#302b27";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        "bold 20px Arial";

    ctx.fillText(
        "100",
        centerX,
        centerY - 10
    );


    ctx.font =
        "14px Arial";

    ctx.fillText(
        "entries",
        centerX,
        centerY + 15
    );

}


/* =====================================
   ADVICE
===================================== */

function getAdvice(
    category,
    emotion
) {

    const data =
        advice[category];


    if (!data) {
        return "";
    }


    const negativeEmotions = {

        Angry: [
            "Angry",
            "Irritated",
            "Frustrated",
            "Furious",
            "Agitated",
            "Tense",
            "Suspicious",
            "Wary",
            "Alarmed",
            "Impatient",
            "Restless",
            "Defensive",
            "Provoked",
            "Uneasy",
            "Overwhelmed"
        ],

        Confident: [
            "Proud",
            "Superior",
            "Envious",
            "Jealous",
            "Humiliated"
        ],

        Sad: [
            "Hopeless",
            "Melancholic",
            "Pessimistic",
            "Lonely",
            "Regretful",
            "Guilty",
            "Ashamed",
            "Discouraged",
            "Miserable",
            "Grieving",
            "Resigned",
            "Yearning",
            "Insecure",
            "Empty",
            "Despairing"
        ],

        Happy: [
            "Overjoyed",
            "Excited",
            "Euphoric",
            "Energetic"
        ],

        Serious: [
            "Detached",
            "Skeptical",
            "Doubtful",
            "Confused",
            "Perplexed",
            "Concerned",
            "Cautious",
            "Uncertain"
        ]

    };


    if (
        negativeEmotions[
            category
        ] &&
        negativeEmotions[
            category
        ].includes(emotion)
    ) {

        return `

            <div class="advice">

                <strong>
                    🌱 A possible direction
                </strong>

                <p>
                    ${data.line}
                </p>

                <p>
                    <strong>
                        Consider:
                    </strong>

                    ${data.destination}
                    →
                    ${data.positive.join(", ")}
                </p>

                <p>
                    💬 ${data.quote}
                </p>

            </div>

        `;

    }


    return "";

}


/* =====================================
   DISPLAY ENTRIES
===================================== */

function displayEntries() {

    const container =
        document.getElementById(
            "entries"
        );


    container.innerHTML = "";


    if (entries.length === 0) {

        container.innerHTML =
            '<div class="empty">' +
            'No entries yet.' +
            '</div>';

        return;

    }


    entries
        .slice()
        .reverse()
        .forEach(
            function(entry) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "entry";


                div.innerHTML =

                    '<div class="entry-number">' +
                    'Entry #' +
                    entry.number +
                    '</div>' +

                    '<div class="entry-date">' +
                    escapeHTML(
                        entry.date
                    ) +
                    '</div>' +

                    '<p>' +
                    escapeHTML(
                        entry.text
                    ) +
                    '</p>' +

                    '<span ' +
                    'class="entry-emotion" ' +
                    'style="background:' +
                    entry.color +
                    '">' +

                    escapeHTML(
                        entry.category
                    ) +

                    ' · ' +

                    escapeHTML(
                        entry.emotion
                    ) +

                    '</span>' +

                    getAdvice(
                        entry.category,
                        entry.emotion
                    ) +

                    '<br>' +

                    '<button ' +
                    'class="delete-button" ' +
                    'type="button">' +

                    'Delete Entry' +

                    '</button>';


                const deleteButton =
                    div.querySelector(
                        ".delete-button"
                    );


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteEntry(
                            entry.id
                        );

                    }
                );


                container.appendChild(
                    div
                );

            }
        );

}


/* =====================================
   DELETE
===================================== */

function deleteEntry(id) {

    entries =
        entries.filter(
            function(entry) {

                return entry.id !== id;

            }
        );


    localStorage.setItem(
        "emotiaryEntries",
        JSON.stringify(
            entries
        )
    );


    displayEntries();

    updateAnalysis();

}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================
   START
===================================== */

createCategories();

displayEntries();

updateAnalysis();

</script>

</body>
</html>
