<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotiary</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f0eb;
    color: #302b27;
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

textarea {
    width: 100%;
    height: 180px;
    box-sizing: border-box;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 12px;
    margin-bottom: 15px;
}

.emotions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 15px 0;
}

.emotion {
    border: 1px solid #ccc;
    background: white;
    border-radius: 20px;
    padding: 10px 14px;
    cursor: pointer;
}

.emotion.selected {
    background: #8064a8;
    color: white;
}

#saveButton {
    width: 100%;
    padding: 15px;
    background: #8064a8;
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

.entry {
    background: white;
    padding: 15px;
    margin-top: 15px;
    border-radius: 12px;
}

.tag {
    display: inline-block;
    background: #8064a8;
    color: white;
    padding: 5px 9px;
    border-radius: 15px;
    margin: 3px;
    font-size: 12px;
}
    .category-selector {
    margin: 20px 0;
}

#categories {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.category {
    padding: 14px 8px;
    border: 3px solid;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.category.selected-category {
    background: #302b27;
    color: white;
}

.specific-emotions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.specific-emotion {
    padding: 10px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 10px;
    cursor: pointer;
}

.specific-emotion.selected-emotion {
    background: #8064a8;
    color: white;
}

@media (max-width: 600px) {

    #categories {
        grid-template-columns: 1fr 1fr;
    }

    .specific-emotions {
        grid-template-columns: 1fr 1fr;
    }

}
</style>
</head>

<body>

</div>

<button id="saveButton">
Save Entry

let selectedCategory = null;
let selectedEmotion = null;

    /* =========================
   DISPLAY CATEGORIES
========================= */

function displayCategories() {

    const container =
        document.getElementById("categories");

    container.innerHTML = "";

    categories.forEach(function(category) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "category";

        button.textContent =
            category.name;

        button.style.borderColor =
            category.color;

        button.onclick = function() {

            selectedCategory = category;

            selectedEmotion = null;

            document
                .querySelectorAll(".category")
                .forEach(function(btn) {
                    btn.classList.remove("selected-category");
                });

            button.classList.add(
                "selected-category"
            );

            displaySpecificEmotions(category);
        };

        container.appendChild(button);

    });

}

    function displaySpecificEmotions(category) {

    const area =
        document.getElementById(
            "specificEmotionArea"
        );

    area.innerHTML = `
        <h3>
            Choose a specific emotion
        </h3>

        <div class="specific-emotions"></div>
    `;

    const emotionContainer =
        area.querySelector(
            ".specific-emotions"
        );

    category.emotions.forEach(function(emotion) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "specific-emotion";

        button.textContent =
            emotion;

        button.onclick = function() {

            selectedEmotion = emotion;

            document
                .querySelectorAll(
                    ".specific-emotion"
                )
                .forEach(function(btn) {

                    btn.classList.remove(
                        "selected-emotion"
                    );

                });

            button.classList.add(
                "selected-emotion"
            );

        };

        emotionContainer.appendChild(button);

    });

}

    button.addEventListener("click", function() {

        const emotion =
            button.dataset.emotion;

        if (selectedEmotions.includes(emotion)) {

            selectedEmotions =
                selectedEmotions.filter(
                    e => e !== emotion
                );

            button.classList.remove("selected");

        } else {

            if (selectedEmotions.length >= 5) {

                alert("Maximum of 5 emotions.");

                return;
            }

            selectedEmotions.push(emotion);

            button.classList.add("selected");
        }

        document.getElementById(
            "emotionCount"
        ).textContent =
            selectedEmotions.length +
            " / 5 emotions selected";

    });

});


/* SAVE */

        ).value.trim();

    alert("Choose one main emotion category.");

}

if (!selectedEmotion) {

}

    const entry = {

    number: entries.length + 1,

    date: new Date().toLocaleString(),

    text: text,

    category: selectedCategory.name,

    categoryColor: selectedCategory.color,

};

    entries.push(entry);

    localStorage.setItem(
        "emotiaryEntries",
        JSON.stringify(entries)
    );

    document.getElementById(
        "diaryText"
    ).value = "";

    selectedCategory = null;
selectedEmotion = null;

    displayCategories();
displayEntries();
