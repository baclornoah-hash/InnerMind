<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emotiary</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f0eb;
    color: #302b27;
}

.container {
    width: 92%;
    max-width: 800px;
    margin: auto;
    padding: 25px 0 60px;
}

h1 {
    color: #70548f;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

textarea {
    width: 100%;
    min-height: 170px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    resize: vertical;
    font-family: inherit;
    font-size: 16px;
}

textarea:focus {
    outline: none;
    border-color: #8064a8;
}

.category-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 15px 0;
}

.category {
    padding: 14px 5px;
    border: 3px solid;
    background: white;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.category.active {
    background: #302b27;
    color: white;
}

.specific-title {
    margin-top: 20px;
}

.emotion-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.emotion {
    padding: 11px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
}

.emotion.active {
    background: #8064a8;
    color: white;
    border-color: #8064a8;
}

.save-button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #8064a8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save-button:hover {
    background: #634b86;
}

.entry {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 15px;
    margin-top: 12px;
    background: #fffdfb;
}

.entry-number {
    font-weight: bold;
    color: #70548f;
}

.entry-date {
    color: #777;
    font-size: 12px;
    margin: 5px 0 12px;
}

.entry-emotion {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.delete-button {
    margin-top: 12px;
    border: none;
    background: transparent;
    color: #a55;
    cursor: pointer;
}

.empty {
    color: #777;
    text-align: center;
    padding: 20px;
}

.message {
    margin-top: 12px;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 600px) {

    .category-list {
        grid-template-columns: repeat(2, 1fr);
    }

    .emotion-list {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>
</head>


<body>

<div class="container">

<h1>🌙 Emotiary</h1>

<p>
Write about your day, then choose the emotion that best describes
what you felt.
</p>


<div class="card">

<h2>📔 New Entry</h2>

<textarea
    id="diaryText"
    placeholder="What's on your mind?"
></textarea>


<h3>1. Choose your main emotion</h3>

<div
    class="category-list"
    id="categoryList">
</div>


<h3
    class="specific-title"
    id="specificTitle">
2. Choose a specific emotion
</h3>

<div
    class="emotion-list"
    id="emotionList">
</div>


<button
    type="button"
    class="save-button"
    id="saveButton">

Save Entry

</button>


<div
    class="message"
    id="message">
</div>

</div>


<div class="card">

<h2>📚 Your Diary</h2>

<div id="entries"></div>

</div>

</div>


<script>

/* =====================================
   EMOTION DATA
===================================== */

const categories = [

{
    id: "red",
    name: "Angry",
    color: "#d9534f",

    emotions: [
        "Angry",
        "Irritated",
        "Frustrated",
        "Furious",
        "Agitated",
        "Tense",
        "Alert",
        "Suspicious",
        "Wary",
        "Alarmed",
        "Intense",
        "Passionate",
        "Impatient",
        "Restless",
        "Defensive",
        "Provoked",
        "Startled",
        "Uneasy",
        "Overwhelmed",
        "Determined"
    ]
},

{
    id: "blue",
    name: "Sad",
    color: "#4d82b8",

    emotions: [
        "Sad",
        "Hopeless",
        "Melancholic",
        "Pessimistic",
        "Lonely",
        "Nostalgic",
        "Regretful",
        "Guilty",
        "Ashamed",
        "Vulnerable",
        "Discouraged",
        "Miserable",
        "Grieving",
        "Reflective",
        "Contemplative",
        "Resigned",
        "Yearning",
        "Insecure",
        "Empty",
        "Despairing"
    ]
},

{
    id: "black",
    name: "Serious",
    color: "#333333",

    emotions: [
        "Serious",
        "Calm",
        "Composed",
        "Neutral",
        "Detached",
        "Stoic",
        "Focused",
        "Curious",
        "Skeptical",
        "Doubtful",
        "Confused",
        "Perplexed",
        "Concerned",
        "Cautious",
        "Rational",
        "Objective",
        "Patient",
        "Controlled",
        "Analytical",
        "Uncertain"
    ]
},

{
    id: "white",
    name: "Confident",
    color: "#777777",

    emotions: [
        "Confident",
        "Proud",
        "Charismatic",
        "Excited",
        "Amused",
        "Flattered",
        "Admiring",
        "Competitive",
        "Ambitious",
        "Triumphant",
        "Superior",
        "Elegant",
        "Playful",
        "Charming",
        "Bold",
        "Hopeful",
        "Envious",
        "Jealous",
        "Embarrassed",
        "Humiliated"
    ]
},

{
    id: "green",
    name: "Happy",
    color: "#4f9b68",

    emotions: [
        "Happy",
        "Joyful",
        "Overjoyed",
        "Cheerful",
        "Excited",
        "Delighted",
        "Amused",
        "Affectionate",
        "Loving",
        "Grateful",
        "Hopeful",
        "Comforted",
        "Relieved",
        "Inspired",
        "Tender",
        "Compassionate",
        "Empathetic",
        "Sentimental",
        "Energetic",
        "Euphoric"
    ]
}

];


/* =====================================
   APP STATE
===================================== */

let selectedCategory = null;

let selectedEmotion = null;

let entries = [];

try {

    entries =
        JSON.parse(
            localStorage.getItem("emotiaryEntries")
        ) || [];

} catch (error) {

    entries = [];

}


/* =====================================
   CREATE CATEGORY BUTTONS
===================================== */

function createCategories() {

    const container =
        document.getElementById(
            "categoryList"
        );

    container.innerHTML = "";

    categories.forEach(function(category) {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "category";

        button.textContent =
            category.name;

        button.style.borderColor =
            category.color;

        button.addEventListener(
            "click",
            function() {

                selectedCategory =
                    category;

                selectedEmotion =
                    null;

                document
                    .querySelectorAll(
                        ".category"
                    )
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    });

                button.classList.add(
                    "active"
                );

                createEmotions(category);

            }
        );

        container.appendChild(button);

    });

}


/* =====================================
   CREATE SPECIFIC EMOTIONS
===================================== */

function createEmotions(category) {

    const container =
        document.getElementById(
            "emotionList"
        );

    container.innerHTML = "";

    category.emotions.forEach(
        function(emotion) {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "emotion";

            button.textContent =
                emotion;

            button.addEventListener(
                "click",
                function() {

                    selectedEmotion =
                        emotion;

                    document
                        .querySelectorAll(
                            ".emotion"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );

                    button.classList.add(
                        "active"
                    );

                }
            );

            container.appendChild(
                button
            );

        }
    );

}


/* =====================================
   SAVE ENTRY
===================================== */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        function() {

            const text =
                document
                    .getElementById(
                        "diaryText"
                    )
                    .value
                    .trim();


            if (text === "") {

                showMessage(
                    "Please write something first."
                );

                return;
            }


            if (selectedCategory === null) {

                showMessage(
                    "Please choose a main emotion."
                );

                return;
            }


            if (selectedEmotion === null) {

                showMessage(
                    "Please choose a specific emotion."
                );

                return;
            }


            const entry = {

                id: Date.now(),

                number:
                    entries.length + 1,

                date:
                    new Date().toLocaleString(),

                text:
                    text,

                category:
                    selectedCategory.name,

                color:
                    selectedCategory.color,

                emotion:
                    selectedEmotion

            };


            entries.push(entry);


            try {

                localStorage.setItem(
                    "emotiaryEntries",
                    JSON.stringify(entries)
                );

            } catch (error) {

                showMessage(
                    "Could not save to this browser."
                );

                console.error(error);

                return;
            }


            document
                .getElementById(
                    "diaryText"
                )
                .value = "";


            selectedCategory = null;

            selectedEmotion = null;


            document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    function(button) {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


            document
                .getElementById(
                    "emotionList"
                )
                .innerHTML = "";


            showMessage(
                "Entry saved successfully! 💜"
            );


            displayEntries();

        }
    );


/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    setTimeout(
        function() {

            message.textContent =
                "";

        },
        3000
    );

}


/* =====================================
   DISPLAY ENTRIES
===================================== */

function displayEntries() {

    const container =
        document.getElementById(
            "entries"
        );

    container.innerHTML = "";


    if (entries.length === 0) {

        container.innerHTML =
            '<div class="empty">' +
            'No entries yet.' +
            '</div>';

        return;

    }


    entries
        .slice()
        .reverse()
        .forEach(
            function(entry) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "entry";


                div.innerHTML =

                    '<div class="entry-number">' +
                    'Entry #' +
                    entry.number +
                    '</div>' +

                    '<div class="entry-date">' +
                    escapeHTML(entry.date) +
                    '</div>' +

                    '<p>' +
                    escapeHTML(entry.text) +
                    '</p>' +

                    '<span ' +
                    'class="entry-emotion" ' +
                    'style="background:' +
                    entry.color +
                    '">' +

                    escapeHTML(
                        entry.category
                    ) +

                    ' · ' +

                    escapeHTML(
                        entry.emotion
                    ) +

                    '</span>' +

                    '<br>' +

                    '<button ' +
                    'class="delete-button" ' +
                    'type="button" ' +
                    'data-id="' +
                    entry.id +
                    '">' +

                    'Delete Entry' +

                    '</button>';


                const deleteButton =
                    div.querySelector(
                        ".delete-button"
                    );


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteEntry(
                            entry.id
                        );

                    }
                );


                container.appendChild(
                    div
                );

            }
        );

}


/* =====================================
   DELETE
===================================== */

function deleteEntry(id) {

    entries =
        entries.filter(
            function(entry) {

                return entry.id !== id;

            }
        );


    localStorage.setItem(
        "emotiaryEntries",
        JSON.stringify(entries)
    );


    displayEntries();

}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================
   START
===================================== */

createCategories();

displayEntries();

</script>

</body>
</html>
