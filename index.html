<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotiary</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f7f2ec;
    color: #302b27;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    color: #70548f;
}

textarea {
    width: 100%;
    height: 180px;
    padding: 15px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    resize: vertical;
}

.emotions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 15px 0;
}

.emotion {
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 20px;
    background: white;
    cursor: pointer;
}

.emotion.selected {
    background: #8064a8;
    color: white;
}

button.save {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #8064a8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.entry {
    background: white;
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
}

.tag {
    display: inline-block;
    background: #8064a8;
    color: white;
    padding: 5px 9px;
    border-radius: 15px;
    font-size: 12px;
    margin: 3px;
}

.delete {
    margin-top: 10px;
    border: none;
    background: none;
    color: #a55;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>🌙 Emotiary</h1>

<p>Write what you're feeling.</p>

<textarea id="diaryText" placeholder="What's on your mind?"></textarea>

<p>
<strong id="count">0 / 5 emotions selected</strong>
</p>

<div class="emotions" id="emotions">

<button class="emotion" data-emotion="Angry">🔴 Angry</button>
<button class="emotion" data-emotion="Irritated">🔴 Irritated</button>

<button class="emotion" data-emotion="Sad">🔵 Sad</button>
<button class="emotion" data-emotion="Hopeless">🔵 Hopeless</button>

<button class="emotion" data-emotion="Emotionless">⚫ Emotionless</button>
<button class="emotion" data-emotion="Serious">⚫ Serious</button>

<button class="emotion" data-emotion="Confident">🟣 Confident</button>
<button class="emotion" data-emotion="Awesome">🟣 Awesome</button>

<button class="emotion" data-emotion="Happy">🟡 Happy</button>
<button class="emotion" data-emotion="Overjoyed">🟡 Overjoyed</button>

<button class="emotion" data-emotion="Afraid">🩵 Afraid</button>
<button class="emotion" data-emotion="Anxious">🩵 Anxious</button>

<button class="emotion" data-emotion="Calm">🌿 Calm</button>
<button class="emotion" data-emotion="Relaxed">🌿 Relaxed</button>

<button class="emotion" data-emotion="Passionate">🟠 Passionate</button>
<button class="emotion" data-emotion="Eager">🟠 Eager</button>

</div>

<button class="save" id="saveButton">
Save Entry
</button>

<h2>Your Diary</h2>

<div id="entries"></div>

</div>

<script>

let selectedEmotions = [];

let entries =
    JSON.parse(localStorage.getItem("emotiaryEntries") || "[]");


/* EMOTION SELECTION */

document.querySelectorAll(".emotion").forEach(button => {

    button.addEventListener("click", function() {

        const emotion =
            this.dataset.emotion;

        const index =
            selectedEmotions.indexOf(emotion);

        if (index !== -1) {

            selectedEmotions.splice(index, 1);

            this.classList.remove("selected");

        } else {

            if (selectedEmotions.length >= 5) {

                alert("You can choose up to 5 emotions.");

                return;
            }

            selectedEmotions.push(emotion);

            this.classList.add("selected");
        }

        document.getElementById("count").textContent =
            selectedEmotions.length +
            " / 5 emotions selected";

    });

});


/* SAVE ENTRY */

document.getElementById("saveButton")
.addEventListener("click", function() {

    const text =
        document.getElementById("diaryText")
        .value
        .trim();

    if (text === "") {

        alert("Please write something first.");

        return;
    }

    if (selectedEmotions.length === 0) {

        alert("Please choose at least one emotion.");

        return;
    }

    const entry = {

        number: entries.length + 1,

        date: new Date().toLocaleString(),

        text: text,

        emotions: [...selectedEmotions]

    };

    entries.push(entry);

    localStorage.setItem(
        "emotiaryEntries",
        JSON.stringify(entries)
    );

    document.getElementById("diaryText").value = "";

    selectedEmotions = [];

    document.querySelectorAll(".emotion")
    .forEach(button => {

        button.classList.remove("selected");

    });

    document.getElementById("count").textContent =
        "0 / 5 emotions selected";

    displayEntries();

    alert("Entry saved! 💜");

});


/* DISPLAY ENTRIES */

function displayEntries() {

    const container =
        document.getElementById("entries");

    container.innerHTML = "";

    if (entries.length === 0) {

        container.innerHTML =
            "<p>No entries yet.</p>";

        return;
    }

    [...entries].reverse().forEach((entry, index) => {

        const div =
            document.createElement("div");

        div.className = "entry";

        div.innerHTML = `

            <strong>
                Entry #${entry.number}
            </strong>

            <p>
                ${entry.date}
            </p>

            <p>
                ${escapeHTML(entry.text)}
            </p>

            <div>
                ${entry.emotions.map(emotion =>
                    `<span class="tag">
                        ${escapeHTML(emotion)}
                    </span>`
                ).join("")}
            </div>

            <button
                class="delete"
                onclick="deleteEntry(${entry.number})">
                Delete
            </button>

        `;

        container.appendChild(div);

    });

}


/* DELETE */

function deleteEntry(number) {

    entries =
        entries.filter(
            entry => entry.number !== number
        );

    localStorage.setItem(
        "emotiaryEntries",
        JSON.stringify(entries)
    );

    displayEntries();

}


/* SAFETY */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* LOAD */

displayEntries();

</script>

</body>
</html>
